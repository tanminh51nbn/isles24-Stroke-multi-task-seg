# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Data Pipeline Configuration
#  Không chứa đường dẫn dataset (truyền runtime từ notebook)
# ═══════════════════════════════════════════════════════════════

# ── K-Fold ──────────────────────────────────────────────────────
kfold:
  n_splits: 5
  stratify_by: "lesion_volume"     # Stratify theo tổng pixel lesion/patient
  n_bins: 5                        # Quantile bins cho stratification
  random_state: 42

# ── Caching ─────────────────────────────────────────────────────
cache:
  dir: "."                         # Override tại runtime (e.g. /kaggle/working)
  # Auto-generated files:
  #   lesion_volumes.json          — per-patient lesion volume (fold_split)
  #   cache_slice_info.json        — per-slice pos/neg flags  (dataset)

# ── Sampling ────────────────────────────────────────────────────
sampling:
  strategy: "weighted"             # "uniform" | "weighted"
  pos_weight: 3.0                  # Slice có lesion → sample gấp 3x

# ── DataLoader ──────────────────────────────────────────────────
dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true                  # Ổn định BatchNorm, tránh batch lẻ

# ── Augmentation (chỉ áp dụng cho train) ────────────────────────
augmentation:
  enabled: true

  horizontal_flip:
    prob: 0.5

  affine:
    prob: 0.5
    rotate_range: 0.26             # ~15° in radians
    scale_range: 0.1               # ±10%
    translate_range: [27, 27]      # ±5% of 544px

  elastic_2d:
    prob: 0.2
    spacing: [50, 50]
    magnitude_range: [1, 3]

  coarse_dropout:
    prob: 0.2
    holes: 8
    spatial_size: [32, 32]
    fill_value: 0.0
