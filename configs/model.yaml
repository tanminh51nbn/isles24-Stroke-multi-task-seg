# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Multi-Task 2.5D U-Net Configuration
#  Shared encoder + 3 independent decoders (Lesion, LVO, CoW)
# ═══════════════════════════════════════════════════════════════

encoder:
  name: "resnet50"
  weights: "RadImageNet-ResNet50.pt" # Sẽ tải tự động trong Kaggle
  depth: 5                           # stem(0) + layer1(1) + layer2(2) + layer3(3) + layer4(4)
  in_channels: 18                    # 6 modalities × 3 slices (2.5D)

decoder:
  # Channels tại mỗi level upsampling (output của block)
  # Phải match với ResNet50 encoder skip connections: [2048, 1024, 512, 256, 64] -> [256, 128, 64, 32, 16]
  channels: [256, 128, 64, 32, 16] 
  attention_type: null              # null | "scse" (Squeeze-and-Excitation)
  # center_block: SMP Unet tự động xây dựng bottleneck nối encoder-decoder

heads:
  dropout: 0.3                      # Spatial Dropout2d để chống overfitting (Khuyên dùng 0.3 cho dataset nhỏ)
  lesion:
    out_channels: 1                 # Binary segmentation — stroke infarct
  lvo:
    out_channels: 1                 # Binary segmentation — large vessel occlusion
  cow:
    out_channels: 1                 # Binary segmentation — Circle of Willis

# ── Output ──
# Raw logits (KHÔNG sigmoid/softmax trong model)
# BCEWithLogitsLoss tự tích hợp sigmoid → numerical stability
