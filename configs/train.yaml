# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ─────────────────────────────
loss:
  lesion:
    type: "focal_tversky"
    alpha: 0.4                    # Phạt đoán nhầm (FP)
    beta: 0.6                     # Phạt bỏ sót (FN)
    gamma: 1.0                    # Không cần focal quá mạnh cho Lesion
  lvo:
    type: "focal_tversky"
    alpha: 0.2                    # Rất nhẹ tay với FP
    beta: 0.8                     # Trừng phạt cực nặng nếu bỏ sót LVO
    gamma: 2.0                    # Focus vào các ca khó
  cow:
    type: "dice_focal"
    lambda_dice: 1.0
    lambda_focal: 1.0
    gamma: 2.0

# ── Multi-task Weighting ────────────────────────────────────────
# Tổng Loss = w_lesion*L_lesion + w_lvo*L_lvo + w_cow*L_cow
task_weights:
  lesion: 2.0                      # Tăng nhẹ trọng số Lesion
  lvo: 5.0                         # LVO là ưu tiên hàng đầu
  cow: 1.0                         # CoW học rất nhanh nên giữ nguyên

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4                       # Peak learning rate (decoders + heads)
  weight_decay: 1.0e-4             # L2 regularization (prevent overfitting)
  encoder_lr_scale: 0.1            # Encoder LR = lr × 0.1 = 3e-5 (protect pretrained)

# ── LR Scheduler ───────────────────────────────────────────────
scheduler:
  warmup_epochs: 5                 # Linear warmup: 0 → lr over 5 epochs
  min_lr: 1.0e-6                   # Cosine annealing floor

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 50
  amp: true                        # Automatic Mixed Precision (float16 forward)
  grad_clip_norm: 1.0              # Max gradient norm — safety net for LVO gradient explosion

  # Composite Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
  composite_weights:
    dice_lesion: 0.4               # Đo chính xác vùng nhồi máu
    recall_lvo: 0.4                # Phát hiện cục máu đông (chỉ cần chạm trúng)
    dice_cow: 0.2                  # Phụ trợ — mạch máu lớn

  # Checkpointing — 3 phiên bản cho 3 use-case lâm sàng
  checkpoint:
    dir: "checkpoints"
    save_best_overall: true        # Composite Score → Release chính
    save_best_lesion: true         # Dice Lesion    → Bác sĩ đo thể tích
    save_best_lvo: true            # Recall LVO     → Bác sĩ cấp cứu

  # Early Stopping (dựa trên Composite Score)
  early_stopping:
    enabled: true
    patience: 15                   # Epochs không cải thiện → stop
    min_delta: 0.001               # Ngưỡng cải thiện tối thiểu

  # Logging
  logging:
    log_interval: 10               # Log mỗi N batches
    visualize_every: 5             # Overlay predictions mỗi N epochs
    wandb:
      enabled: false               # Set true trên Kaggle + WANDB_API_KEY
      project: "isles24-stroke"
      run_name: null               # Auto-generate nếu null
