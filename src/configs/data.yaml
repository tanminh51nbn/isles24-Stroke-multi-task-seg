# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Data Pipeline Configuration
#  Không chứa đường dẫn dataset (truyền runtime từ notebook)
# ═══════════════════════════════════════════════════════════════

# ── Patient-level Split ──────────────────────────────────────────
split:
  val_ratio: 0.2
  seed: 42
  mode: "kfold"
  n_folds: 5
  stratify_by: "lvo"
  current_fold: 0

# ── DataLoader ───────────────────────────────────────────────────
dataloader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

# ── Sampling Strategy ────────────────────────────────────────────
sampling:
  enabled: true
  metadata_csv: "/kaggle/working/dataset_metadata.csv"
  lvo_oversample_factor: 10
  cow_neg_keepall: true
  plain_neg_ratio: 0.15
  downsample_neg_ratio: 0.5

# ── Augmentation ─────────────────────────────────────────────────
augmentation:
  enabled: true
  horizontal_flip:
    prob: 0.5     # Tăng từ 0.25 lên 0.5 vì não đối xứng, lật là cách x2 data an toàn nhất

  affine:
    prob: 0.3
    rotate_deg: 10   # Giảm nhẹ từ 15 xuống 10 (bệnh nhân nằm chụp CT ít khi vẹo đầu quá 10 độ)
    scale_range: 0.1
    translate_px: 10

  elastic_transform:
    prob: 0.2        # Giảm từ 0.35 xuống 0.2 để tránh làm "chảy não" (mất hình dạng giải phẫu)
    alpha: 15.0
    sigma: 6.0
    alpha_affine: 50

  gaussian_noise:
    prob: 0.2        # Giảm từ 0.4 vì thêm quá nhiều nhiễu sẽ làm mất vết LVO li ti
    mean: 0.0
    std: 0.02        # Giảm từ 0.03

  gaussian_blur:
    prob: 0.2        # Giảm từ 0.3
    max_sigma: 1.0

  random_gamma:
    prob: 0.2        # Giảm từ 0.4 vì giá trị độ xám của CT (HU) là cố định vật lý, không nên đổi quá trớn
    gamma_range: [0.8, 1.2] # Thu hẹp từ [0.7, 1.3]

  grid_distortion:
    prob: 0.0        # TẮT HẲN (Vì đã có elastic_transform. Dùng cả 2 sẽ làm hỏng hoàn toàn cấu trúc mạch máu)
    num_steps: 5
    distort_limit: 0.2

  intensity_scale:
    prob: 0.2        # Giảm từ 0.4
    factor: 0.05     # Thu hẹp từ 0.1 (Chỉ cho phép sáng/tối đi 5%)

  modality_dropout:
    prob: 0.1

  channel_dropout:
    prob: 0.2
    max_drop: 3
