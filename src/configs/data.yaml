# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Data Pipeline Configuration
#  Không chứa đường dẫn dataset (truyền runtime từ notebook)
# ═══════════════════════════════════════════════════════════════

# ── Patient-level Split ──────────────────────────────────────────
split:
  val_ratio: 0.2
  seed: 42
  mode: "kfold"
  n_folds: 5
  stratify_by: "lvo"
  current_fold: 0

# ── DataLoader ───────────────────────────────────────────────────
dataloader:
  batch_size: 24
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

# ── Sampling Strategy ────────────────────────────────────────────
sampling:
  enabled: true
  metadata_csv: "/kaggle/working/dataset_metadata.csv"
  lvo_oversample_factor: 10
  cow_neg_keepall: true
  plain_neg_ratio: 0.15
  downsample_neg_ratio: 0.5

# ── Augmentation ─────────────────────────────────────────────────
augmentation:
  enabled: true
  horizontal_flip:
    prob: 0.0

  affine:
    prob: 0.7
    rotate_deg: 15
    scale_range: 0.1
    translate_px: 10

  elastic_transform:
    prob: 0.5
    alpha: 15.0
    sigma: 6.0
    alpha_affine: 50

  gaussian_noise:
    prob: 0.4
    mean: 0.0
    std: 0.03

  gaussian_blur:
    prob: 0.3
    max_sigma: 1.0

  random_gamma:
    prob: 0.5
    gamma_range: [0.7, 1.3]

  grid_distortion:
    prob: 0.4
    num_steps: 5
    distort_limit: 0.2

  intensity_scale:
    prob: 0.5
    factor: 0.1
