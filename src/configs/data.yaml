# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Data Pipeline Configuration
#  Không chứa đường dẫn dataset (truyền runtime từ notebook)
# ═══════════════════════════════════════════════════════════════

# ── Patient-level Split ──────────────────────────────────────────
split:
  val_ratio: 0.2
  seed: 42
  mode: "kfold" # "single" hoặc "kfold"
  n_folds: 5
  stratify_by: "lvo" # Đảm bảo LVO patients phân bổ đều qua các fold
  current_fold: 0 # Được ghi đè bởi PINELINE.py khi chạy K-Fold
  # GroupShuffleSplit theo patient_id — chống Data Leakage

# ── DataLoader ───────────────────────────────────────────────────
dataloader:
  batch_size: 16 # Giảm xuống 16 để tránh OOM khi Unfreeze Encoder ở Epoch 11
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true # Tránh batch size 1 ở cuối epoch

# ── Sampling Strategy ────────────────────────────────────────────
sampling:
  enabled: true
  metadata_csv: "/kaggle/working/dataset_metadata.csv"
  # Oversample lát cắt có LVO (rất hiếm) lên 3 lần (giảm để tránh thống trị task)
  lvo_oversample_factor: 3
  # [FIX 1] Tách neg_list thành 2 nhóm:
  # - cow_neg_keepall: Giữ 100% slice CoW(+) Lesion(-) — counter-examples được yếu quý
  # - plain_neg_ratio: Chỉ giữ 30% slice não trống hoàn toàn (không CoW, không Lesion)
  cow_neg_keepall: true # Giữ 100% slice CoW(+), Lesion(-)
  plain_neg_ratio: 0.3 # Downsample slice trống (thay cho downsample_neg_ratio)
  downsample_neg_ratio: 0.5 # Fallback nếu không có cột has_cow trong metadata

# ── Augmentation ─────────────────────────────────────────────────
augmentation:
  enabled: true

  # Flip tắt hoàn toàn — không chắc chắn về hướng định vị não trong dataset MIP
  horizontal_flip:
    prob: 0.0

  affine:
    prob: 0.7
    rotate_deg: 15
    scale_range: 0.1
    translate_px: 10

  elastic_transform:
    prob: 0.5
    alpha: 1.0
    sigma: 50
    alpha_affine: 50

  gaussian_noise:
    prob: 0.5
    mean: 0.0
    std: 0.05

  intensity_scale:
    prob: 0.6
    factor: 0.1
