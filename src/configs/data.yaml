# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Data Pipeline Configuration
#  Không chứa đường dẫn dataset (truyền runtime từ notebook)
# ═══════════════════════════════════════════════════════════════

# ── Patient-level Split ──────────────────────────────────────────
split:
  val_ratio: 0.2
  seed: 42
  mode: "kfold"
  n_folds: 5
  stratify_by: "lvo"
  current_fold: 0

# ── DataLoader ───────────────────────────────────────────────────
dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 1
  drop_last: true

# ── Sampling Strategy ────────────────────────────────────────────
sampling:
  enabled: true
  metadata_csv: "/kaggle/working/dataset_metadata.csv"
  lvo_oversample_factor: 3
  cow_neg_keepall: true
  plain_neg_ratio: 0.2

# ── Augmentation ─────────────────────────────────────────────────
augmentation:
  enabled: true
  horizontal_flip:
    prob: 0.5

  affine:
    prob: 0.5
    rotate_deg: 10
    scale_range: 0.1
    translate_px: 10

  elastic_transform:
    prob: 0.6
    alpha: 35.0
    sigma: 8.0
    alpha_affine: 50

  gaussian_noise:
    prob: 0.25
    mean: 0.0
    std: 0.02

  gaussian_blur:
    prob: 0.25
    max_sigma: 1.0

  random_gamma:
    prob: 0.5
    gamma_range: [0.8, 1.2]

  grid_distortion:
    prob: 0.25
    num_steps: 5
    distort_limit: 0.2

  intensity_scale:
    prob: 0.5
    factor: 0.05

  modality_dropout:
    prob: 0.1

  channel_dropout:
    prob: 0.1
    max_drop: 3

  perfusion_jitter:
    prob: 0.4
    scale_range: [0.7, 1.3]
    shift_range: 0.1

  lesion_copy_paste:
    prob: 0.5
