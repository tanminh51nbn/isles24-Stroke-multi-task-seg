# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── PCGrad ───────────────────────────────────────────────
# Gradient Surgery — Yu et al., NeurIPS 2020
# Tất cả 3 task đều học, gradient chỉ được "xọng nhẹ" khi xung đột.
pcgrad:
  enabled: true         # false = tắt PCGrad, chạy backward bình thường

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.3
    beta: 0.7
    weight: 0.4
    boundary_weight: 0.3

  lvo:
    type: "modified_focal" # Heatmap Regression — CenterNet-style
    mfl_alpha: 2.0 # Phạt mạnh khi bỏ sót tâm LVO
    mfl_beta: 4.0 # Giảm phạt cho vùng quầng sáng xung quanh
    weight: 0.4 # Cân bằng với Lesion (0.4) và CoW (0.2)

  cow:
    type: "tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.2
    boundary_weight: 0.25

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
# Dùng Recall cho LVO (chỉ cần detect được, không cần viền chính xác)
composite_score:
  dice_lesion_weight: 0.4
  recall_lvo_weight: 0.4
  dice_cow_weight: 0.2
  thresholds:
    lesion: 0.5
    lvo: 0.15
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 1.0e-3
  encoder_lr_scale: 0.05
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 10 #can 15
  hold_epochs: 5 #can 10
  min_lr: 1.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 50 #can 100
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 10

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 15 #can 25
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 15 #can 25
    patience: 15 #can 30
    min_delta: 0.001

  # Logging
  logging:
    log_interval: 41
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
