# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "focal_tversky"
    alpha: 0.3
    beta: 0.7
    gamma: 2.0
    weight: 0.43
    hd_weight: 0.30
    cl_weight: 0.0
    cl_iters: 3

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.43
    lvo_cls_weight: 0.25
    lvo_cls_pos_weight: 2.0

  cow:
    type: "cl_tversky"
    alpha: 0.2
    beta: 0.8
    weight: 0.14
    cl_weight: 0.45
    iters: 4

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*F1_LVO + w3*Dice_CoW
# Tập trung vào F1-Score cho LVO để cân bằng giữa Recall và Precision
composite_score:
  dice_lesion_weight: 0.45
  f1_lvo_weight: 0.45
  dice_cow_weight: 0.1
  thresholds:
    lesion: 0.5
    lvo: 0.10      # Giá trị khởi đầu (epoch 1–20, encoder khóa) — get_lvo_threshold() sẽ override runtime
    cow: 0.5
  # ── LVO Threshold Linear Ramp ───────────────────────────────────
  # Tránh metric cliff khi encoder unfreeze ở epoch 21
  # Công thức: thresh = thresh_freeze + t*(thresh_unfreeze-thresh_freeze)
  # với t = (epoch - freeze_epoch) / (ramp_end_epoch - freeze_epoch)
  lvo_threshold_ramp:
    freeze_epoch:    20    # Epoch cuối cùng giữ ngưỡng dễ (khớp freeze_encoder_epochs)
    ramp_end_epoch:  30    # Epoch bắt đầu giữ ngưỡng ketat (khớp early_stopping.start_epoch)
    thresh_freeze:   0.10  # Ngưỡng khi encoder đang bị khóa  (epoch ≤ 20)
    thresh_unfreeze: 0.30  # Ngưỡng đích sau khi hội tụ       (epoch ≥ 30)


# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 5.0e-4
  weight_decay: 5.0e-2
  encoder_lr_scale: 0.05
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 7
  hold_epochs: 13
  min_lr: 5.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100
  amp: true
  grad_clip_norm: 4.0
  freeze_encoder_epochs: 20

  # Cơ chế dìu nhau đi (DWA+)
  dwa_start_epoch: 8
  dwa_temperature: 1.0
  dwa_ema_alpha: 0.2
  dwa_momentum: 0.5
  initial_weights:
    lesion: 0.40
    lvo: 0.35
    cow: 0.25

  # Performance Gap Weighting (thay thế DWA+)
  pgw:
    start_epoch: 8
    temperature: 0.5
    momentum: 0.3
    w_min: 0.1
    w_max:
      lesion: 2.2
      lvo: 1.3
      cow: 1.0
    performance_targets:
      lesion: 0.8
      lvo: 0.50
      cow: 0.88

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 20 # Lưu sau khi đã mở băng Encoder
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 30
    patience: 20
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 80
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
