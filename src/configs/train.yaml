# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.2
    beta: 0.8
    weight: 0.45
    hd_weight: 0.2

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.50

  cow:
    type: "cl_tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.05
    cl_weight: 0.55
    iters: 4

# ── Uncertainty Weighting Settings ──────────────────────────────
uncertainty:
    s_min_lvo: 0.1         # [NEW] Ép LVO cực gắt để phá vỡ bám đuổi CoW
    s_min_lesion: 0.3      # [NEW] Giảm nhẹ sàn để tăng độ nhạy
    s_min_cow: 0.6         # Giữ nguyên để CoW làm nền móng
    
    # --- DWA+ Configuration ---
    dwa_temperature: 2.0   # [NEW] Điều chỉnh độ gắt của thi đua (Thấp = Gắt, Cao = Ôn hòa)

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*F1_LVO + w3*Dice_CoW
# Tập trung vào F1-Score cho LVO để cân bằng giữa Recall và Precision
composite_score:
  dice_lesion_weight: 0.35 # Giảm để ưu tiên LVO
  f1_lvo_weight: 0.60      # Ưu tiên tối đa LVO
  dice_cow_weight: 0.05    # CoW là phụ trợ
  thresholds:
    lesion: 0.45
    lvo: 0.30 # Nâng ngưỡng để AI học cách dự đoán LVO sắc nét, giảm nhiễu
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 3.0e-2
  encoder_lr_scale: 0.02 # [FIX] Chỉ dùng 2% LR cho Encoder để tránh nổ LVO
  eps: 1.0e-8

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 7
  hold_epochs: 5
  min_lr: 5.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100 # Nâng lên 100 để lộ trình Curriculum có đủ thời gian tinh chỉnh
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 15

  # Cơ chế dìu nhau đi (DWA+)
  dwa_start_epoch: 1
  initial_weights:
    lesion: 1.0
    lvo: 1.0
    cow: 1.0

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 10 # Bắt đầu lưu sớm hơn vì không còn freeze
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 30
    patience: 30 #can 30
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 80
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
