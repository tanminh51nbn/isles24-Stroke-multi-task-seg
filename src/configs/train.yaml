# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.3
    beta: 0.7
    weight: 0.35
    boundary_weight: 0.3

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.35

  cow:
    type: "tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.3
    boundary_weight: 0.4

# ── Uncertainty Weighting Settings ──────────────────────────────
uncertainty:
  s_min_lesion: 0.6
  s_min_lvo: 0.85    # Chặn cứng hơn cho LVO để tránh chiếm quyền ưu tiên
  s_min_cow: 0.7

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
# Dùng Recall cho LVO (chỉ cần detect được, không cần viền chính xác)
composite_score:
  dice_lesion_weight: 0.35
  recall_lvo_weight: 0.35
  dice_cow_weight: 0.3
  thresholds:
    lesion: 0.4
    lvo: 0.15
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 1.0e-2
  encoder_lr_scale: 0.01
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 10 #can 15
  hold_epochs: 5 #can 10
  min_lr: 1.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 50 #can 100
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 10

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 15 #can 25
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 15 #can 25
    patience: 15 #can 30
    min_delta: 0.001

  # Logging
  logging:
    log_interval: 40
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
