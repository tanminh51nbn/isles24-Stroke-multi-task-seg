# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.2    # Giảm alpha, tăng beta để tập trung vào Recall (tránh bỏ sót vùng bệnh)
    beta: 0.8
    weight: 0.4   # Tăng nhẹ trọng số tổng của Lesion
    hd_weight: 0.2 # GIẢM HD xuống vì mô hình đã học viền quá tốt, cần tập trung vào "ruột"

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.4

  cow:
    type: "cl_tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.2  # Giảm nhẹ CoW vì đã đạt 90%, nhường tài nguyên cho Task khác
    cl_weight: 0.55
    iters: 4

# ── Uncertainty Weighting Settings ──────────────────────────────
uncertainty:
  s_min_lesion: 0.4   # Hạ sàn xuống 0.4 để mô hình có thể dồn lực mạnh hơn vào Lesion
  s_min_lvo: 0.7     # Hạ sàn LVO như đã thảo luận trước đó
  s_min_cow: 0.7

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
# Dùng Recall cho LVO (chỉ cần detect được, không cần viền chính xác)
composite_score:
  dice_lesion_weight: 0.4 # Ưu tiên Lesion hơn trong điểm tổng
  recall_lvo_weight: 0.4
  dice_cow_weight: 0.2
  thresholds:
    lesion: 0.3  # Hạ xuống 0.3 để "tô màu" mạnh tay hơn
    lvo: 0.15
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 3.0e-2 # Tăng gấp 3 lần để chống Overfitting mạnh hơn
  encoder_lr_scale: 0.1  # Tăng lên 0.1 để encoder học nhanh hơn
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 5    # Giảm xuống 3 để đạt LR đỉnh nhanh hơn
  hold_epochs: 3
  min_lr: 1.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 50 #can 100
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 10

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 10 #can 25
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 10 #can 25
    patience: 15 #can 30
    min_delta: 0.001

  # Logging
  logging:
    log_interval: 40
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
