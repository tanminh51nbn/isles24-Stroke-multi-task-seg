# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.3
    beta: 0.7
    weight: 0.35
    hd_weight: 0.25

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.5

  cow:
    type: "cl_tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.15
    cl_weight: 0.5
    iters: 4

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*F1_LVO + w3*Dice_CoW
# Tập trung vào F1-Score cho LVO để cân bằng giữa Recall và Precision
composite_score:
  dice_lesion_weight: 0.4
  f1_lvo_weight: 0.50
  dice_cow_weight: 0.1
  thresholds:
    lesion: 0.45
    lvo: 0.2 # Nâng ngưỡng để AI học cách dự đoán LVO sắc nét, giảm nhiễu
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 3.0e-2
  encoder_lr_scale: 0.02 # [FIX] Chỉ dùng 2% LR cho Encoder để tránh nổ LVO
  eps: 1.0e-8

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 7
  hold_epochs: 23
  min_lr: 5.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100 # Nâng lên 100 để lộ trình Curriculum có đủ thời gian tinh chỉnh
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 20

  # Cơ chế dìu nhau đi (DWA+)
  dwa_start_epoch: 8      # [NEW] Kích hoạt sau Warmup để tránh nhiễu
  dwa_temperature: 1.0
  dwa_ema_alpha: 0.2      # [NEW] EMA smoothing cho Loss (0.2 = ~5 epoch)
  dwa_momentum: 0.5       # [NEW] Momentum cho trọng số (chống nhảy vọt)
  initial_weights:
    lesion: 0.35
    lvo: 0.50
    cow: 0.15

  # Performance Gap Weighting (thay thế DWA+)
  # Điều chỉnh trọng số task theo khoảng cách tới target metric,
  # không phải tốc độ thay đổi loss — tránh failure mode "đầu hàng task khó".
  pgw:
    start_epoch: 5          # Kích hoạt sau warmup
    temperature: 0.5        # Softmax temp (đặt nhỏ → phân hóa mạnh hơn)
    momentum: 0.3           # Momentum (đặt nhỏ → phản ứng nhanh hơn DWA+)
    w_min: 0.1              # Trọng số sàn mỗi task (CoW không bị bỏ qua hoàn toàn)
    performance_targets:    # Mục tiêu hiệu suất cần đạt được
      lesion: 0.85          # Dice Score
      lvo:    0.50          # F1 Score (slice-level, ð [0,1])
      cow:    0.90          # Dice Score

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 20 # Lưu sau khi đã mở băng Encoder
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 30
    patience: 20
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 80
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
