# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.2
    beta: 0.8
    weight: 0.38
    hd_weight: 0.2

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.38

  cow:
    type: "cl_tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.24
    cl_weight: 0.55
    iters: 4

# ── Uncertainty Weighting Settings ──────────────────────────────
uncertainty:
  s_min_lesion: 0.4
  s_min_lvo: 0.4
  s_min_cow: 0.7

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
# Dùng Recall cho LVO (chỉ cần detect được, không cần viền chính xác)
composite_score:
  dice_lesion_weight: 0.38 # Ưu tiên Lesion hơn trong điểm tổng
  recall_lvo_weight: 0.38
  dice_cow_weight: 0.24
  thresholds:
    lesion: 0.3
    lvo: 0.1
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 3.0e-4
  weight_decay: 3.0e-2
  encoder_lr_scale: 0.1
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 7
  hold_epochs: 18
  min_lr: 5.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100 # Nâng lên 100 để lộ trình Curriculum có đủ thời gian tinh chỉnh
  amp: true
  grad_clip_norm: 1.0
  freeze_encoder_epochs: 7

  # [NEW] Curriculum Learning Schedule cho LVO
  curriculum_learning:
    enabled: true
    # Giai đoạn 1: Epoch 0-5   (Soft Target, Low Weight)
    # Giai đoạn 2: Epoch 6-13  (Medium Target, Normal Weight)
    # Giai đoạn 2b: Epoch 14-15 (Sharp Target, Bridge Weight)
    # Giai đoạn 3: Epoch 16-100 (Strict Binary, High Weight)


  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 25 
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 25 
    patience: 20 #can 30
    min_delta: 0.001

  # Logging
  logging:
    log_interval: 40
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
