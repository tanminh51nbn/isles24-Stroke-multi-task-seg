# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "focal_tversky"
    alpha: 0.35
    beta: 0.65
    gamma: 1.35
    slice_pos_weight: 2.5
    sdf_weight: 0.45
    sdf_fg_weight: 0.2

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.5
    mfl_beta: 4.5
    sigma_init: 5.0
    sigma_floor: 1.25
    sigma_decay: 0.97
    slice_pos_weight: 5.0
    max_radius: 14.5

  cow:
    type: "cl_tversky"
    alpha: 0.2
    beta: 0.8
    cl_weight: 0.45
    iters: 8

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Dice_LVO + w3*Dice_CoW
composite_score:
  dice_lesion_weight: 0.39
  dice_lvo_weight: 0.39
  dice_cow_weight: 0.22
  thresholds:
    lesion: 0.5
    lvo: 0.5
    cow: 0.5


# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 1e-3
  weight_decay: 0.05
  encoder_lr_scale: 0.05
  eps: 1.0e-7

scheduler:
  warmup_epochs: 5
  hold_epochs: 7
  min_lr: 1.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100
  amp: true
  grad_clip_norm: 20.0
  freeze_encoder_epochs: 11

  initial_weights:
    lesion: 1.00
    lvo: 1.00
    cow: 1.00

  # Performance Gap Weighting (thay thế DWA+)
  pgw:
    start_epoch: 8
    temperature: 1.0
    momentum: 0.8
    w_min:
      lesion: 0.50
      lvo: 0.30
      cow: 0.40
    w_max:
      lesion: 5.0
      lvo: 4.0
      cow: 3.0
    performance_targets:
      lesion: 0.75
      lvo: 0.40
      cow: 0.88

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 20
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 20
    patience: 15
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 40
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
