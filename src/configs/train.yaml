# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "tversky"
    alpha: 0.4
    beta: 0.6
    weight: 0.35

  lvo:
    type: "focal_tversky"
    alpha: 0.2
    beta: 0.8
    gamma: 1.5
    weight: 0.55

  cow:
    type: "tversky"
    alpha: 0.5
    beta: 0.5
    weight: 0.10

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*Recall_LVO + w3*Dice_CoW
# Dùng Recall cho LVO (chỉ cần detect được, không cần viền chính xác)
composite_score:
  dice_lesion_weight: 0.4
  recall_lvo_weight: 0.4
  dice_cow_weight: 0.2
  thresholds:
    lesion: 0.5
    lvo: 0.4               # Ưu tiên Recall cho LVO (ngưỡng thấp hơn)
    cow: 0.5

# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 5.0e-4                # Base LR cho Decoder và Heads
  weight_decay: 1.0e-3      # L2 regularization
  encoder_lr_scale: 0.1     # Encoder LR = 1e-4 × 0.1 = 1e-5
  eps: 1.0e-7               # Cải thiện độ ổn định cho AMP (Mixed Precision)
                            # Bảo vệ RadImageNet weights, tránh quên kiến thức y tế

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 10         # Linear ramp-up từ 0 → base_lr trong 10 epoch đầu
  hold_epochs: 5            # Giữ nguyên base_lr trong 5 epoch sau khi unfreeze để ổn định
  min_lr: 1.0e-6            # Sàn cho CosineAnnealing

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 50
  amp: true                 # Automatic Mixed Precision (float16) — bắt buộc trên T4
  grad_clip_norm: 1.0       # Clip gradient để tránh LVO loss explode (weight 10x)
  freeze_encoder_epochs: 10  # Đóng băng cả 2 encoder trong 5 epoch đầu
                            # Để Decoder + Heads ổn định trước khi fine-tune encoder

  # Checkpointing — 3 checkpoint cho 3 use-case lâm sàng
  checkpoint:
    dir: "checkpoints"
    save_best_overall: true   # Composite Score cao nhất → mô hình sản xuất
    save_best_lesion: true    # Dice Lesion cao nhất → bác sĩ cần đo thể tích nhồi máu
    save_best_lvo: true       # Recall LVO cao nhất → cấp cứu phát hiện tắc mạch

  # Early Stopping
  early_stopping:
    enabled: true
    patience: 15             # Dừng nếu 15 epoch liên tiếp không cải thiện
    min_delta: 0.001         # Ngưỡng cải thiện tối thiểu

  # Logging
  logging:
    log_interval: 58         # Cứ 25% epoch (58 batch) in log 1 lần cho gọn
    visualize_every: 5       # Visualize prediction overlay mỗi 5 epoch
    wandb:
      enabled: false         # Bật nếu có WANDB_API_KEY trên Kaggle
      project: "isles24-stroke"
      run_name: null         # Auto-generate
