# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "compound_dice_bce"
    alpha: 0.3
    beta: 0.7
    weight: 0.43
    hd_weight: 0.30
    hd_fg_weight: 0.15
    cl_weight: 0.0
    bce_pos_weight: 0.15
    cl_iters: 3

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    weight: 0.43
    lvo_cls_weight: 0.25
    lvo_cls_pos_weight: 2.0

  cow:
    type: "cl_tversky"
    alpha: 0.2
    beta: 0.8
    weight: 0.14
    cl_weight: 0.45
    iters: 4

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*F1_LVO + w3*Dice_CoW
# Tập trung vào F1-Score cho LVO để cân bằng giữa Recall và Precision
composite_score:
  dice_lesion_weight: 0.45
  f1_lvo_weight: 0.45
  dice_cow_weight: 0.1
  thresholds:
    lesion: 0.5
    lvo: 0.23      # Cố định suốt quá trình training (không dùng ramp)
    cow: 0.5


# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 5.0e-4
  weight_decay: 5.0e-2
  encoder_lr_scale: 0.02
  eps: 1.0e-7

# ── LR Scheduler ────────────────────────────────────────────────
scheduler:
  warmup_epochs: 7
  hold_epochs: 13
  min_lr: 5.0e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100
  amp: true
  grad_clip_norm: 4.0
  freeze_encoder_epochs: 100

  # Cơ chế dìu nhau đi (DWA+)
  dwa_start_epoch: 8
  dwa_temperature: 1.0
  dwa_ema_alpha: 0.2
  dwa_momentum: 0.5
  initial_weights:
    lesion: 1.20
    lvo: 1.05
    cow: 0.75

  # Performance Gap Weighting (thay thế DWA+)
  pgw:
    start_epoch: 8
    temperature: 1.0
    momentum: 0.8
    w_min:
      lesion: 0.15
      lvo: 0.15
      cow: 0.20
    w_max:
      lesion: 4.8
      lvo: 3.9
      cow: 3.0
    performance_targets:
      lesion: 0.7
      lvo: 0.55
      cow: 0.88

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 20 # Lưu sau khi đã mở băng Encoder
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 30
    patience: 20
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 80
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
