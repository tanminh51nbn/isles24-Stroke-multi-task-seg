# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Training Configuration
#  Loss, Optimizer, Scheduler, Training params
# ═══════════════════════════════════════════════════════════════

# ── Loss Function (Task-Specific) ──────────────────────────────
loss:
  lesion:
    type: "modified_focal"
    mfl_alpha: 1.5
    mfl_beta: 2.0
    sigma_init: 9.0
    sigma_floor: 4.0
    sigma_decay: 0.97
    slice_pos_weight: 5.0
    cls_weight: 0.20
    cls_pos_weight: 2.5
    dice_weight: 0.3

  lvo:
    type: "modified_focal"
    mfl_alpha: 2.0
    mfl_beta: 4.0
    sigma_init: 7.5
    sigma_floor: 2.0
    sigma_decay: 0.96
    slice_pos_weight: 6.0
    cls_weight: 0.25
    cls_pos_weight: 2.0

  cow:
    type: "cl_tversky"
    alpha: 0.2
    beta: 0.8
    cl_weight: 0.45
    iters: 4

# ── Composite Validation Score ──────────────────────────────────
# Score = w1*Dice_Lesion + w2*F1_LVO + w3*Dice_CoW
# Tập trung vào F1-Score cho LVO để cân bằng giữa Recall và Precision
composite_score:
  dice_lesion_weight: 0.45
  f1_lvo_weight: 0.45
  dice_cow_weight: 0.1
  thresholds:
    lesion: 0.5
    lvo: 0.23
    cow: 0.5


# ── Optimizer ───────────────────────────────────────────────────
optimizer:
  type: "adamw"
  lr: 2.5e-4
  weight_decay: 5.0e-2
  encoder_lr_scale: 0.10
  eps: 1.0e-7

scheduler:
  warmup_epochs: 6
  hold_epochs: 6
  min_lr: 2.5e-6

# ── Training ────────────────────────────────────────────────────
training:
  epochs: 100
  amp: true
  grad_clip_norm: 2.0
  freeze_encoder_epochs: 11

  initial_weights:
    lesion: 1.00
    lvo: 1.00
    cow: 1.00

  # Performance Gap Weighting (thay thế DWA+)
  pgw:
    start_epoch: 8
    temperature: 1.0
    momentum: 0.8
    w_min:
      lesion: 0.50   # Tăng từ 0.15 → 0.50: Lesion luôn là mỏ neo không gian cho Encoder
      lvo: 0.30      # Tăng từ 0.15 → 0.30: Bảo vệ LVO khỏi sụp đổ khi cạnh tranh
      cow: 0.20
    w_max:
      lesion: 5.0
      lvo: 4.0
      cow: 3.0
    performance_targets:
      lesion: 0.75
      lvo: 0.55
      cow: 0.88

  # Checkpointing
  checkpoint:
    dir: "checkpoints"
    start_epoch: 20 # Lưu sau khi đã mở băng Encoder
    save_best_overall: true
    save_best_lesion: true
    save_best_lvo: true

  # Early Stopping
  early_stopping:
    enabled: true
    start_epoch: 25
    patience: 20
    min_delta: 0.0001

  # Logging
  logging:
    log_interval: 80
    visualize_every: 5
    wandb:
      enabled: false
      project: "isles24-stroke"
      run_name: null
