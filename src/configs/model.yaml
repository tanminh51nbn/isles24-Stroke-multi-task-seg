# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Dual-Encoder Multi-Task UNet Configuration
#  CTA Branch: ResNet-50 (RadImageNet)
#  Perfusion Branch: DenseNet-121 (RadImageNet)
# ═══════════════════════════════════════════════════════════════

# ── Channel Split ───────────────────────────────────────────────
# Input tensor shape: (18, 256, 256)
# Each Z-slice contains 6 channels: [CTA_w1, CTA_w2, Tmax, CBF, CBV, MTT]
# Layout: [Z-1: 0-5] [Z: 6-11] [Z+1: 12-17]
channel_split:
  cta_indices: [0, 1, 6, 7, 12, 13]         # CTA_w1, CTA_w2 from each slice
  perfusion_indices: [2, 3, 4, 5, 8, 9, 10, 11, 14, 15, 16, 17]  # Tmax,CBF,CBV,MTT from each slice

# ── Single Encoder (DenseNet-121) ──────────────────────────────────
encoder:
  name: "densenet121"
  in_channels: 18
  # RadImageNet PyTorch weights
  weights: "/kaggle/input/datasets/muynhmuynh/radimagenet-pytorch/DenseNet121.pt"
  # Skip levels 1-5
  output_channels: [64, 128, 256, 512, 1024]
  # Encoder Dropout: tăng dần theo chiều sâu
  enc_dropout: [0.05, 0.10, 0.15, 0.20]

# ── Decoder ─────────────────────────────────────────────────────
decoder:
  attention_type: "dual"  # "dual", "ag", or null
  out_channels: [256, 128, 64, 32]
  final_ch: 16
  dropout:
    shared: 0.2
    cow: 0.15
    lvo: 0.2
    lesion: 0.35 # Tăng mạnh cho Lesion decoder block

# ── Heads (Residual Task Blocks) ────────────────────────────────
heads:
  activation: "GELU"
  lesion:
    out_channels: 1
    dropout: 0.5 # Tăng mạnh cho Lesion Head
  lvo:
    out_channels: 1
    dropout: 0.3
  cow:
    out_channels: 1
    dropout: 0.3

# ── Output ──────────────────────────────────────────────────────
# Raw logits (NO sigmoid/softmax in model forward)
# BCEWithLogitsLoss handles sigmoid internally for numerical stability
