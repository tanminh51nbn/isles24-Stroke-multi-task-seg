# ═══════════════════════════════════════════════════════════════
#  ISLES'24 — Dual-Encoder Multi-Task UNet Configuration
#  CTA Branch: ResNet-50 (RadImageNet)
#  Perfusion Branch: DenseNet-121 (RadImageNet)
# ═══════════════════════════════════════════════════════════════

# ── Channel Split ───────────────────────────────────────────────
# Input tensor shape: (18, 256, 256)
# Each Z-slice contains 6 channels: [CTA_w1, CTA_w2, Tmax, CBF, CBV, MTT]
# Layout: [Z-1: 0-5] [Z: 6-11] [Z+1: 12-17]
channel_split:
  cta_indices: [0, 1, 6, 7, 12, 13]         # CTA_w1, CTA_w2 from each slice
  perfusion_indices: [2, 3, 4, 5, 8, 9, 10, 11, 14, 15, 16, 17]  # Tmax,CBF,CBV,MTT from each slice

# ── CTA Encoder (ResNet-34) ──────────────────────────────────────
cta_encoder:
  name: "resnet34"
  in_channels: 6
  output_channels: [64, 64, 128, 256, 512]

# ── Perfusion Encoder (EfficientNet-B0) ─────────────────────────
perfusion_encoder:
  name: "efficientnet_b0"
  in_channels: 12
  output_channels: [16, 24, 40, 112, 320]

# ── Decoder ─────────────────────────────────────────────────────
decoder:
  attention_type: "dual"  # "dual", "ag", or null
  out_channels: [128, 64, 32, 16] # Decoder siêu nhẹ
  final_ch: 16

# ── Heads (Residual Task Blocks) ────────────────────────────────
heads:
  dropout: 0.25
  activation: "GELU"
  lesion:
    out_channels: 1
  lvo:
    out_channels: 1
  cow:
    out_channels: 1

# ── Output ──────────────────────────────────────────────────────
# Raw logits (NO sigmoid/softmax in model forward)
# BCEWithLogitsLoss handles sigmoid internally for numerical stability
